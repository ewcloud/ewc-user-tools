---
- name: Create or update user {{ user.username }}
  community.general.keycloak_user:
    auth_keycloak_url: "https://{{ iam_ingress_hostname }}"
    auth_realm: "{{ tenant.name }}"
    auth_username: "{{ iam_tenant_admin_username }}"
    auth_password: "{{ iam_tenant_admin_password }}"
    realm: "{{ tenant.name }}"
    username: "{{ user.username }}"
    email: "{{ user.email }}"
    firstName: "{{ user.first_name }}"
    lastName: "{{ user.last_name }}"
    enabled: "{{ user.enabled | default(true) }}"
    emailVerified: "{{ user.email_verified | default (true) }}"
    state: present
    validate_certs: true
  register: keycloak_user_result

- name: Assert user ID was returned for {{ user.username }}
  ansible.builtin.assert:
    that:
      - keycloak_user_result.get('end_state',{}).get('id', '') != '' or keycloak_user_result.get('existing',{}).get('id','') != ''
    fail_msg: >
      Failed to retrieve Keycloak user ID for '{{ user.username }}'
      in realm '{{ tenant.name }}'.
    success_msg: Successfully retrieved Keycloak user ID for '{{ user.username }}'

- name: Record user reconciliation outcome
  ansible.builtin.set_fact:
    reconciled_users: >-
      {{
        reconciled_users | default({}) | combine({
          tenant.name ~ '/' ~ user.username: {
            'user_id': keycloak_user_result.get('end_state',{}).get('id') if keycloak_user_result.get('end_state',{}).get('id','') != '' else keycloak_user_result.existing.id,
            'is_new_user': keycloak_user_result.get('end_state',{}).get('id', '') != '',
            'enabled': user.enabled | default(true),
            'email': user.email
          }
        })
      }}
