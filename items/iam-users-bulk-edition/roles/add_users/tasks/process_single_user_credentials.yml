---
- name: Resolve reconciled user context for {{ user.username }}
  ansible.builtin.set_fact:
    current_user_context: "{{ reconciled_users[tenant.name ~ '/' ~ user.username] }}"

- name: Determine if password reset email should be sent for {{ user.username }}
  ansible.builtin.set_fact:
    send_password_email: >-
      {{
        current_user_context.is_new_user | bool
        and current_user_context.enabled | bool
        and current_user_context.email is defined
        and current_user_context.email | length > 0
      }}

- name: Ensure UPDATE_PASSWORD required action is set for {{ user.username }}
  community.general.keycloak_user:
    auth_keycloak_url: "https://{{ iam_ingress_hostname }}"
    auth_realm: "{{ tenant.name }}"
    auth_username: "{{ iam_tenant_admin_username }}"
    auth_password: "{{ iam_tenant_admin_password }}"
    realm: "{{ tenant.name }}"
    username: "{{ user.username }}"
    required_actions:
      - UPDATE_PASSWORD
    state: present
    validate_certs: true
  when: current_user_context.is_new_user

- name: Trigger password reset email for {{ user.username }}
  ansible.builtin.uri:
    url: "https://{{ iam_ingress_hostname }}/admin/realms/{{ tenant.name }}/users/{{ current_user_context.user_id }}/execute-actions-email"
    method: PUT
    headers:
      Content-Type: application/json
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    body_format: json
    status_code:
      - 204
    validate_certs: true
  when: send_password_email

- name: Log password reset email outcome for {{ user.username }}
  ansible.builtin.debug:
    msg: >-
      Password reset email {{ 'sent' if send_password_email else 'not sent' }}
      for user '{{ user.username }}' in realm '{{ tenant.name }}'.

- name: Pause for 1 second to prevent overload of Keycloak API (SMTP)
  ansible.builtin.pause:
    seconds: 1
  when: send_password_email
