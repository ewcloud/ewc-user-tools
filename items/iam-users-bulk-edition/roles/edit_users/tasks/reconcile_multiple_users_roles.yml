---
- name: Reconcile roles for users in realm {{ tenancy.name }}
  ansible.builtin.include_tasks: reconcile_single_user_roles.yml
  loop: "{{ tenancy.users }}"
  loop_control:
    loop_var: user
    label: "{{ user.email }}"

- name: Summarize role reconciliation for users in realm {{ tenancy.name }}
  ansible.builtin.debug:
    msg: "{{ edit_users_roles_report | default({}) }}"
