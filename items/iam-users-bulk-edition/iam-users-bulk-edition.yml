- name: IAM Users bulk edition
  hosts: localhost
  connection: local
  gather_facts: false

  vars_prompt:
    - name: iam_tenant_admin_username
      prompt: IAM Tenant admin username
      private: false

    - name: iam_tenant_admin_password
      prompt: IAM tenant admin password
      private: true

  tasks:

    - name: Load input specification
      ansible.builtin.include_vars:
        file: ./vars/inputs.yml
        name: tenancy

    - name: Edit users as per input specification
      ansible.builtin.include_role:
        name: edit_users
